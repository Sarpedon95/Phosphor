# Phosphor — Build, archive & TestFlight upload
#
# Required GitHub Actions secrets:
#   APPLE_ID                       — Apple ID used to upload to TestFlight
#   APP_SPECIFIC_PASSWORD          — app-specific password for that Apple ID
#   TEAM_ID                        — 10-character Apple Developer Team ID
#   CERTIFICATE_BASE64             — base64-encoded distribution .p12
#   CERTIFICATE_PASSWORD           — password for the .p12 (also used as
#                                    temporary keychain password)
#   PROVISIONING_PROFILE_BASE64    — base64-encoded .mobileprovision
#   CODE_SIGN_IDENTITY             — e.g. "Apple Distribution: James … (TEAMID)"
#   PROVISIONING_PROFILE_SPECIFIER — name of the provisioning profile
#
# CFBundleVersion strategy (matches Hyperion):
#   `${{ github.run_number }}` is patched into BOTH project.yml
#   (CURRENT_PROJECT_VERSION) before XcodeGen, AND Info.plist (CFBundleVersion)
#   after generation. This guarantees the build number monotonically
#   increases per CI run without manual bookkeeping.

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Archive & Upload
    runs-on: macos-15
    timeout-minutes: 45

    env:
      ARCHIVE_PATH: build/Phosphor.xcarchive
      EXPORT_PATH: build
      IPA_PATH: build/Phosphor.ipa

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Select Xcode
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'

      # 3. Install XcodeGen
      - name: Install XcodeGen
        run: brew install xcodegen

      # 4. Patch project.yml with the build number BEFORE generating.
      - name: Patch project.yml build number
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          path = "project.yml"
          build = os.environ["BUILD_NUMBER"]
          with open(path, "r") as f:
              text = f.read()
          new, count = re.subn(
              r'(CURRENT_PROJECT_VERSION:\s*)"?\d+"?',
              f'\\1"{build}"',
              text,
              count=1,
          )
          if count == 0:
              sys.exit("CURRENT_PROJECT_VERSION key not found in project.yml")
          with open(path, "w") as f:
              f.write(new)
          print(f"Patched CURRENT_PROJECT_VERSION → {build}")
          PY

      # 5. Generate the Xcode project.
      - name: Run XcodeGen
        run: xcodegen generate

      # 6. Patch CFBundleVersion in the generated Info.plist as a belt-and-
      #    braces step (XcodeGen produces it from `info:` so the value already
      #    matches, but PlistBuddy guarantees the artifact regardless of how
      #    `info:` is structured).
      - name: Patch Info.plist build number
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion ${BUILD_NUMBER}" \
            Phosphor/Info.plist

      # 7. Import the signing certificate into a fresh temporary keychain.
      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "$CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"

      # 8. Install the provisioning profile.
      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$PROFILE_DIR/Phosphor.mobileprovision"

      # 9. Archive (Release).
      - name: Archive
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Phosphor.xcodeproj \
            -scheme Phosphor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ secrets.CODE_SIGN_IDENTITY }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}" \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}" \
            | tee build.log

      # 10. Export the archive to an IPA using ExportOptions.plist.
      - name: Export archive
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -o pipefail
          # xcodebuild does not expand $(...) inside the export plist, so the
          # real team ID is substituted here at build time.
          /usr/libexec/PlistBuddy \
            -c "Set :teamID ${TEAM_ID}" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$EXPORT_PATH" \
            -allowProvisioningUpdates \
            | tee -a build.log

      # 11. Upload to TestFlight.
      #
      # `xcrun altool --upload-app` is the supported CLI for App Store Connect
      # iOS uploads in Xcode 16. `notarytool` is NOT a substitute — it only
      # handles macOS notarization, not iOS App Store distribution, so do not
      # "modernize" this to notarytool. (An App Store Connect API key via
      # --apiKey/--apiIssuer is an alternative auth, but app-specific password
      # auth remains valid.)
      - name: Upload to TestFlight
        if: github.event_name == 'push'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --username "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD"

      # 12. On failure, capture build logs.
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
