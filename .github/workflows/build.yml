# Phosphor — Build, archive & TestFlight upload
#
# Required GitHub Actions secrets:
#   APPLE_ID                           — Apple ID used to upload to TestFlight
#   APP_SPECIFIC_PASSWORD              — app-specific password for that Apple ID
#   TEAM_ID                            — 10-character Apple Developer Team ID
#   CERTIFICATE_BASE64                 — base64-encoded distribution .p12
#   CERTIFICATE_PASSWORD               — password for the .p12 (also used as
#                                        temporary keychain password)
#   PROVISIONING_PROFILE_BASE64_MAIN   — base64-encoded main app .mobileprovision
#   PROVISIONING_PROFILE_BASE64_WIDGETS — base64-encoded widgets .mobileprovision
#   PROVISIONING_PROFILE_BASE64_LIVEACTIVITY — base64-encoded liveactivity .mobileprovision
#   CODE_SIGN_IDENTITY                 — e.g. "Apple Distribution: James … (TEAMID)"
#
# CFBundleVersion strategy (matches Hyperion):
#   `${{ github.run_number }}` is patched into BOTH project.yml
#   (CURRENT_PROJECT_VERSION) before XcodeGen, AND Info.plist (CFBundleVersion)
#   after generation. This guarantees the build number monotonically
#   increases per CI run without manual bookkeeping.

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Archive & Upload
    runs-on: macos-14
    timeout-minutes: 45

    env:
      ARCHIVE_PATH: build/Phosphor.xcarchive
      EXPORT_PATH: build
      IPA_PATH: build/Phosphor.ipa

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Select Xcode
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      # 3. Install XcodeGen
      - name: Install XcodeGen
        run: brew install xcodegen

      # 4. Patch project.yml with the build number BEFORE generating.
      - name: Patch project.yml build number
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          path = "project.yml"
          build = os.environ["BUILD_NUMBER"]
          with open(path, "r") as f:
              text = f.read()
          new, count = re.subn(
              r'(CURRENT_PROJECT_VERSION:\s*)"?\d+"?',
              f'\\1"{build}"',
              text,
              count=1,
          )
          if count == 0:
              sys.exit("CURRENT_PROJECT_VERSION key not found in project.yml")
          with open(path, "w") as f:
              f.write(new)
          print(f"Patched CURRENT_PROJECT_VERSION → {build}")
          PY

      # 5. Generate the Xcode project.
      - name: Run XcodeGen
        run: xcodegen generate

      # 6. Patch CFBundleVersion in the generated Info.plist as a belt-and-
      #    braces step (XcodeGen produces it from `info:` so the value already
      #    matches, but PlistBuddy guarantees the artifact regardless of how
      #    `info:` is structured).
      - name: Patch Info.plist build number
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion ${BUILD_NUMBER}" \
            Phosphor/Info.plist

      # 7. Import the signing certificate into a fresh temporary keychain.
      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "$CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"

          echo "=== Keychains in search list ==="
          security list-keychains -d user
          echo "=== All identities in build keychain (including invalid) ==="
          security find-identity -p codesigning "$KEYCHAIN_PATH"
          echo "=== Valid identities only ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # 8. Install the provisioning profiles (main app + 2 extensions).
      - name: Install provisioning profiles
        env:
          PROVISIONING_PROFILE_BASE64_MAIN: ${{ secrets.PROVISIONING_PROFILE_BASE64_MAIN }}
          PROVISIONING_PROFILE_BASE64_WIDGETS: ${{ secrets.PROVISIONING_PROFILE_BASE64_WIDGETS }}
          PROVISIONING_PROFILE_BASE64_LIVEACTIVITY: ${{ secrets.PROVISIONING_PROFILE_BASE64_LIVEACTIVITY }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          install_profile() {
            local b64="$1" name="$2"
            local tmp uuid
            tmp=$(mktemp /tmp/profile.XXXXXX)
            echo "$b64" | base64 --decode > "$tmp"
            uuid=$(security cms -D -i "$tmp" 2>/dev/null | plutil -extract UUID raw -)
            if [ -z "$uuid" ]; then
              uuid=$(strings "$tmp" | grep -E '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' | head -1)
            fi
            echo "Installing $name UUID=$uuid" >&2
            cp "$tmp" "$PROFILE_DIR/$uuid.mobileprovision"
            rm "$tmp"
            printf '%s' "$uuid"
          }

          MAIN_UUID=$(install_profile "$PROVISIONING_PROFILE_BASE64_MAIN" "Phosphor App Store")
          WIDGETS_UUID=$(install_profile "$PROVISIONING_PROFILE_BASE64_WIDGETS" "Phosphor Widgets Distribution")
          LIVEACTIVITY_UUID=$(install_profile "$PROVISIONING_PROFILE_BASE64_LIVEACTIVITY" "Phosphor LiveActivity Distribution")

          echo "MAIN_UUID=$MAIN_UUID" >> $GITHUB_ENV
          echo "WIDGETS_UUID=$WIDGETS_UUID" >> $GITHUB_ENV
          echo "LIVEACTIVITY_UUID=$LIVEACTIVITY_UUID" >> $GITHUB_ENV

          echo "=== Installed profiles ==="
          ls -la "$PROFILE_DIR/"

      # 9. Archive (Release).
      - name: Archive
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Phosphor.xcodeproj \
            -scheme Phosphor \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}" \
            ASSETCATALOG_COMPILER_SKIP_OPTIMIZATION=YES \
            | tee build.log

      # 10. Inspect archive to verify profiles were embedded during archiving.
      - name: Inspect archive contents
        run: |
          echo "=== Archive app bundle ==="
          ls -la "$ARCHIVE_PATH/Products/Applications/Phosphor.app/" | grep -E "mobileprovision|embedded" || echo "No embedded.mobileprovision in main app"
          echo "=== Archive extensions ==="
          ls -la "$ARCHIVE_PATH/Products/Applications/Phosphor.app/PlugIns/" 2>/dev/null || echo "No PlugIns"
          for ext in "$ARCHIVE_PATH/Products/Applications/Phosphor.app/PlugIns/"*.appex; do
            echo "--- $ext ---"
            ls -la "$ext/" | grep -E "mobileprovision|embedded" || echo "No embedded.mobileprovision"
          done

      # 11. Export the archive to an IPA using ExportOptions.plist.
      - name: Export archive
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -o pipefail
          /usr/libexec/PlistBuddy \
            -c "Set :teamID ${TEAM_ID}" ExportOptions.plist
          /usr/libexec/PlistBuddy \
            -c "Set :provisioningProfileMapping:com.sarpedon.phosphor ${MAIN_UUID}" ExportOptions.plist
          /usr/libexec/PlistBuddy \
            -c "Set :provisioningProfileMapping:com.sarpedon.phosphor.widgets ${WIDGETS_UUID}" ExportOptions.plist
          /usr/libexec/PlistBuddy \
            -c "Set :provisioningProfileMapping:com.sarpedon.phosphor.liveactivity ${LIVEACTIVITY_UUID}" ExportOptions.plist
          echo "=== ExportOptions.plist after injection ==="
          cat ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$EXPORT_PATH" \
            -allowProvisioningUpdates \
            | tee -a build.log

      # 11. Inspect IPA contents (debug).
      - name: Inspect IPA contents
        run: |
          echo "=== IPA Contents ==="
          unzip -l "$IPA_PATH" | grep -E "mobileprovision|embedded" || echo "No mobileprovision found"
          echo ""
          echo "=== Payload Structure ==="
          unzip -l "$IPA_PATH" | grep "Payload/" | head -30

      # 12. Upload to TestFlight.
      #
      # `xcrun altool --upload-app` is the supported CLI for App Store Connect
      # iOS uploads in Xcode 16. `notarytool` is NOT a substitute — it only
      # handles macOS notarization, not iOS App Store distribution, so do not
      # "modernize" this to notarytool. (An App Store Connect API key via
      # --apiKey/--apiIssuer is an alternative auth, but app-specific password
      # auth remains valid.)
      - name: Upload to TestFlight
        if: github.event_name == 'push'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --username "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD"

      # 13. On failure, capture build logs.
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
